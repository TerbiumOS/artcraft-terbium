name: Update and package Terbium ports

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      apps:
        description: "Space-separated app IDs; leave empty for all configured apps"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: rolling-latest-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Rust 1.95 toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Install wasm-opt
        uses: NiklasEi/wasm-opt-action@v2
        with:
          file: "*.wasm"
          optimize_all: false
      - name: Run app packager
        env:
          APP_IDS: ${{ inputs.apps }}
        run: |
          if [ -n "$APP_IDS" ]; then
            node scripts/package-apps.mjs $APP_IDS
          else
            node scripts/package-apps.mjs
          fi
      - name: Replace rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="rolling-latest"
          release_title="Latest rolling build"
          release_notes="Automated rolling build of the latest configured ArtCraft web apps. This release is replaced on each successful workflow run."

          missing_packages=0
          while IFS=$'\t' read -r app_id _; do
            package="dist/${app_id}.tapp.zip"
            if [ ! -f "$package" ]; then
              echo "Missing $package; packaging $app_id for the complete rolling release"
              node scripts/package-apps.mjs "$app_id"
            fi
            if [ ! -f "$package" ]; then
              echo "Failed to create $package" >&2
              missing_packages=1
            fi
          done < <(node scripts/package-apps.mjs --list)

          if [ "$missing_packages" -ne 0 ]; then
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release delete "$release_tag" --cleanup-tag --yes
          fi

          if git rev-parse --verify "refs/tags/$release_tag" >/dev/null 2>&1; then
            git tag -d "$release_tag" || true
          fi
          git push origin --delete "$release_tag" >/dev/null 2>&1 || true
          git tag "$release_tag" "$GITHUB_SHA"
          git push origin "$release_tag"
          gh release create "$release_tag" dist/*.tapp.zip \
            --title "$release_title" \
            --notes "$release_notes" \
            --latest
